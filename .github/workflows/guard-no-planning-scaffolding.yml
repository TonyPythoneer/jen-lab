name: 🛡️ Guard · No Planning Scaffolding

# GSD and superpowers generate their own planning/spec files (.planning,
# docs/superpowers) to drive themselves while a task is in progress. A finished
# PR must NOT contain any of them — their absence is the signal that the working
# context was cleared once the task was done. These paths are gitignored, so this
# job is a backstop against an accidental force-add.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No planning scaffolding committed
        run: |
          found=$(git ls-files .planning docs/superpowers)
          if [ -n "$found" ]; then
            echo "::error::Planning scaffolding must be cleared before merge — these files are committed:"
            echo "$found"
            exit 1
          fi
          echo "✓ no .planning / docs/superpowers committed"
