# When develop moves ahead of main, open (or refresh) a single
# develop -> main "promotion" PR. Common release-flow pattern.
name: promote-develop-to-main

on:
  push:
    branches: [develop]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  open-promotion-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Open or update develop -> main PR when develop is ahead
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ahead=$(git rev-list --count origin/main..origin/develop)
          if [ "$ahead" -eq 0 ]; then
            echo "develop is not ahead of main — nothing to promote."
            exit 0
          fi

          existing=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Promotion PR #$existing already open (develop is $ahead commit(s) ahead)."
            exit 0
          fi

          gh pr create --base main --head develop \
            --title "Promote develop → main ($ahead commit(s))" \
            --body "Automated promotion PR — develop is $ahead commit(s) ahead of main."
