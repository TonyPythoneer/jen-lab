name: 🧪 App Tests

# Stack (2026-06): Vue 3 + Vite (vite-plus, vite-ssg, Velite). Nuxt removed.

on:
  pull_request:
    paths:
      - "app/**"
      - "server/**"
      - "_cloudflare/**"
      - "schemas/**"
      - "content/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "vite.config.ts"
      - "velite.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "*.d.ts"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "server/**"
      - "_cloudflare/**"
      - "schemas/**"
      - "content/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "vite.config.ts"
      - "velite.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "*.d.ts"
      - ".github/workflows/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.3

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm test
