name: 🧪 CI · App Test

# Stack (2026-06): Vue 3 + Vite (vite-plus, vite-ssg, Velite). Nuxt removed.

on:
  pull_request:
    paths:
      - "src/**"
      - "server/**"
      - "_cloudflare/**"
      - "configs/**"
      - "content/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "index.html"
      - "vite.config.ts"
      - "velite.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "*.d.ts"
      - ".github/workflows/ci-app-test.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "server/**"
      - "_cloudflare/**"
      - "configs/**"
      - "content/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "index.html"
      - "vite.config.ts"
      - "velite.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "*.d.ts"
      - ".github/workflows/ci-app-test.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
          run-install: false

      - run: pnpm install --frozen-lockfile

      # Build first so generated type stubs exist (generated/velite, auto-imports.d.ts,
      # components.d.ts, typed-router.d.ts are gitignored). vue-tsc in `pnpm check`
      # needs them.
      - run: pnpm build

      - run: pnpm check

      - run: pnpm test
