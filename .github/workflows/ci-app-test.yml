name: 🧪 App Tests

# Migration status (2026-06): this pipeline targets the current Nuxt 4 stack.
# When the Nuxt 4 → Vue 3 + Vite migration lands (tracking: issue #57), the path
# filters (e.g. nuxt.config.ts → vite.config.ts + velite.config.ts) and the
# build/check commands here must be updated to the Vite+ toolchain.

on:
  pull_request:
    paths:
      - "app/**"
      - "server/**"
      - "_cloudflare/**"
      - "schemas/**"
      - "content/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "nuxt.config.ts"
      - "content.config.ts"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "*.d.ts"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "server/**"
      - "_cloudflare/**"
      - "schemas/**"
      - "content/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "nuxt.config.ts"
      - "content.config.ts"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "*.d.ts"
      - ".github/workflows/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.3

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test
