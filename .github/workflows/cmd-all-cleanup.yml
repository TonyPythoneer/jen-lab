# Owner-only command: comment "/all-cleanup" on any issue or PR to prune
# Cloudflare Pages deployments project-wide, keeping only the newest main and
# newest develop deployment. Posts the report back as a comment.
#
# REQUIRED REPO SECRETS (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
# Both are read automatically by wrangler from the environment.

name: 💬 Cmd · All Cleanup
# guide: Prune ALL Cloudflare Pages deployments project-wide, keeping only the latest `main` and latest `develop` build. Posts a report.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  all-cleanup:
    # No github.event.issue.pull_request check on purpose: this prune is
    # project-wide, so it is allowed from any issue or PR comment.
    if: >
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/all-cleanup')
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge with reaction
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: "eyes",
            });

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: prune
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: jen-lab
        run: |
          node scripts/github/fetch-deployments.ts "$CLOUDFLARE_PROJECT_NAME" > deployments.json
          node scripts/github/cleanup-deployments.ts deployments.json main develop
          deleted=0; failed=0
          while read -r id; do
            if [ -n "$id" ] && pnpm exec wrangler pages deployment delete "$id" --project-name "$CLOUDFLARE_PROJECT_NAME" --force; then
              deleted=$((deleted+1))
            else
              failed=$((failed+1))
            fi
          done < ids.txt
          echo "deleted=$deleted" >> "$GITHUB_ENV"
          echo "failed=$failed" >> "$GITHUB_ENV"

      - name: Upsert command comment
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- cmd-all-cleanup -->";
            const success = "${{ steps.prune.outcome }}" === "success";
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            let report = "";
            try {
              report = fs.readFileSync("report.md", "utf8").trim();
            } catch {}

            const failed = process.env.failed || "0";
            const failNote =
              failed !== "0" ? `\n\n⚠️ ${failed} deployment(s) could not be deleted.` : "";
            const header = `**[💬 Cmd · All Cleanup](${runUrl})**`;
            const body = success
              ? `${marker}\n${header}\n\n${report || "Cleanup ran but produced no report."}${failNote}`
              : `${marker}\n${header}\n\n❌ All-cleanup failed.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
