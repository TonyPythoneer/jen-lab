name: 📦 CI · Bundle Size

# Builds the site, diffs against the deployed baseline of the target branch,
# and posts the result as a sticky PR comment so reviewers see it before merging.

on:
  pull_request:
    paths:
      - "src/**"
      # Storybook never ships, so stories cannot change the bundle.
      - "!**/*.stories.ts"
      - "!src/storybook/**"
      - "content/**"
      - "scripts/lib/**"
      - "configs/**"
      - "scripts/github/bundle-report.ts"
      - "scripts/github/bundle-diff.ts"
      - "index.html"
      - "vite.config.ts"
      - "velite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-bundle-size.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
          run-install: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Bundle report (current)
        run: pnpm exec jiti scripts/github/bundle-report.ts --json > /tmp/current.json

      # Restore the most recent baseline from the target branch.
      # Saved by ci-bundle-baseline.yml on each push to main/develop; the key's
      # base.sha is an exact hit when the PR targets the branch head, otherwise
      # restore-keys falls back to the newest baseline on that branch.
      # Falls through gracefully if no cache exists yet (first PR on a new branch).
      - name: Restore bundle baseline
        uses: actions/cache/restore@v4
        with:
          path: /tmp/base.json
          key: bundle-baseline-${{ github.base_ref }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            bundle-baseline-${{ github.base_ref }}-

      - name: Bundle diff
        env:
          BASE_REF: ${{ github.base_ref }}
          DEPLOY_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          DEPLOY_MSG="$(git log -1 --format=%s "$DEPLOY_SHA" 2>/dev/null || true)" \
            pnpm exec jiti scripts/github/bundle-diff.ts /tmp/base.json /tmp/current.json > /tmp/diff.md || true

      - name: Upsert bundle comment
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- ci-bundle-size -->";
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const header = `**[📦 CI · Bundle Size](${runUrl})**`;
            let diff = "";
            try {
              diff = fs.readFileSync("/tmp/diff.md", "utf8").trim();
            } catch {}
            if (!diff) return;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `${marker}\n${header}\n\n${diff}`,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `${marker}\n${header}\n\n${diff}`,
              });
            }

      - name: Per-page bundle report
        if: always()
        run: |
          {
            echo '## 📦 Per-page initial load (gzipped)'
            echo '```'
            pnpm exec jiti scripts/github/bundle-report.ts
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
