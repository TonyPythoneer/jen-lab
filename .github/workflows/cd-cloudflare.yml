# Deploys to Cloudflare Pages when a PR is merged into main or develop,
# then posts the wrangler deployment summary back to the PR.
#
# REQUIRED REPO SECRETS (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
# Both are read automatically by wrangler from the environment.

name: 🚀 Deploy · Cloudflare

on:
  pull_request:
    types: [closed]
    branches: [main, develop]
    # Skip the deploy when a merged PR touches ONLY files that cannot change the
    # built site (CI, docs, editor config, tests, helper scripts). If any file
    # outside this list changed, the deploy still runs. Note: `*.md` matches only
    # root-level docs (README, CLAUDE, ...); blog posts live in content/*.md and
    # are intentionally NOT ignored, so editing a post still deploys.
    paths-ignore:
      - ".github/**"
      - ".claude/**"
      - ".agents/**"
      - ".zed/**"
      - ".storybook/**"
      - "docs/**"
      - "tasks/**"
      - "tests/**"
      - "scripts/**"
      - "*.md"
      - ".gitignore"
      - ".prettierignore"
      - "renovate.json"
      - "skills-lock.json"
      - "tsconfig.scripts.json"
      - "tsconfig.stories.json"
      - "tsconfig.test.json"

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.3

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: deploy
        run: |
          set -o pipefail
          pnpm deploy 2>&1 | tee deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Extract wrangler summary
        if: always()
        run: node --experimental-strip-types scripts/github/wrangler-summary.ts deploy.log > wrangler-summary.txt || true

      - name: Upsert PR comment
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- cd-cloudflare -->";
            const success = "${{ steps.deploy.outcome }}" === "success";
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            let summary = "";
            try {
              summary = fs.readFileSync("wrangler-summary.txt", "utf8").trim();
            } catch {}

            const body = success
              ? `${marker}\n\`\`\`\n${summary || "Deployed."}\n\`\`\``
              : `${marker}\n❌ Cloudflare Pages deploy failed. ` +
                `See the [workflow run](${runUrl}).`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
