# Deploys to Cloudflare Pages when a PR is merged into main or develop,
# then posts the wrangler deployment summary back to the PR.
#
# REQUIRED REPO SECRETS (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
# Both are read automatically by wrangler from the environment.

name: 🚀 CD · Deploy

on:
  pull_request:
    types: [closed]
    branches: [main, develop]
    # Allowlist of build inputs: deploy runs only when a merged PR touches
    # something that can change the built site. Anything not listed here is
    # none of this workflow's business. A new build-input directory MUST be
    # added here AND to the CI workflows' path lists.
    paths:
      - "src/**"
      # Storybook is dev-server only; stories and the story wrapper never ship.
      - "!**/*.stories.ts"
      - "!src/storybook/**"
      - "configs/**"
      - "content/**"
      - "public/**"
      - "server/**"
      - "_cloudflare/**"
      # Icon codegen helpers feed the build; other scripts/ are CI/dev tooling.
      - "scripts/lib/**"
      - "index.html"
      - "vite.config.ts"
      - "velite.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/setup@v1
        with:
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - id: deploy
        env:
          # The branch the PR merged into (main or develop). Passing --branch
          # makes Cloudflare route the deploy deterministically — main to the
          # production environment, develop to a named preview — and tags the
          # deployment with correct branch metadata. Without it wrangler guesses
          # from git, which is unreliable in the detached HEAD of a PR checkout
          # and leaves the cleanup workflows unable to identify the branch.
          BRANCH: ${{ github.event.pull_request.base.ref }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm build
          pnpm exec wrangler pages deploy --branch "$BRANCH" 2>&1 | tee deploy.log

      - name: Extract wrangler summary
        if: always()
        run: node scripts/github/wrangler-summary.ts deploy.log > wrangler-summary.txt || true

      # The bundle-size baseline is written by ci-bundle-baseline.yml on push to
      # main/develop, NOT here. A cache saved during this pull_request run would be
      # scoped to refs/pull/N/merge and unreadable by future PRs.

      - name: Upsert PR comment
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- cd-cloudflare -->";
            const success = "${{ steps.deploy.outcome }}" === "success";
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            let summary = "";
            try {
              summary = fs.readFileSync("wrangler-summary.txt", "utf8").trim();
            } catch {}
            let diff = "";
            try {
              diff = fs.readFileSync("/tmp/diff.md", "utf8").trim();
            } catch {}

            const header = `**[🚀 CD · Deploy](${runUrl})**`;
            const body = success
              ? `${marker}\n${header}\n\n${summary || "Deployed."}` +
                (diff ? `\n\n${diff}` : "")
              : `${marker}\n${header}\n\n❌ Cloudflare Pages deploy failed.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
