name: 📦 CI · Bundle Baseline

# Writes the bundle-size baseline that ci-bundle-size.yml diffs PRs against.
#
# WHY this runs on `push`, not on the deploy's `pull_request: closed`:
# GitHub Actions scopes a cache to the git ref of the run that created it.
# A cache written during a `pull_request` run is scoped to `refs/pull/N/merge`,
# which NO other PR can read — so a baseline saved that way is invisible and the
# diff always falls back to "baseline unavailable". A `push` to main/develop runs
# on `refs/heads/<branch>`, so the cache lands on the branch (main = default) and
# every later PR targeting that branch can restore it.
#
# The cache `path` is part of the cache version hash: save and restore must
# declare the IDENTICAL path (/tmp/base.json) or every lookup misses.

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    # Only rebuild the baseline when something that can change the built bundle
    # changed, so a docs-only push keeps the previous (still-valid) baseline
    # instead of overwriting it. Must stay in sync with ci-bundle-size.yml.
    paths:
      - "src/**"
      # Storybook never ships, so stories cannot change the bundle.
      - "!**/*.stories.ts"
      - "!src/storybook/**"
      - "content/**"
      - "scripts/lib/**"
      - "configs/**"
      - "scripts/github/bundle-report.ts"
      - "index.html"
      - "vite.config.ts"
      - "velite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-bundle-baseline.yml"

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Bundle report (current)
        run: pnpm exec jiti scripts/github/bundle-report.ts --json > /tmp/base.json

      - name: Save bundle baseline
        uses: actions/cache/save@v4
        with:
          path: /tmp/base.json
          key: bundle-baseline-${{ github.ref_name }}-${{ github.sha }}
