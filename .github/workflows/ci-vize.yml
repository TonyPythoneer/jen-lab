name: 🦀 CI · Vize Compiler

# The Vue SFC compiler sits behind the VIZE feature flag (vite.config.ts):
#   default       → @vitejs/plugin-vue (stable, production)
#   VIZE=true     → vize (Rust, experimental)
#
# This CI proves the SAME app renders correct prerendered HTML under BOTH
# compilers. `pnpm compare:ssg` builds the app once per compiler, prints an
# HTML / JS / CSS / build-time comparison table, and gates content: vize is
# pre-1.0 and can exit 0 while every page collapses to an empty shell (its
# CJS-interop once duplicated vue-router and broke SSR provide/inject), so the
# run fails if either compiler dropped a route.

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/ci/**"
      - "vite.config.ts"
      - "velite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - ".github/workflows/ci-vize.yml"
  push:
    branches: [chore/vize, develop, main]
    paths:
      - "src/**"
      - "scripts/ci/**"
      - "vite.config.ts"
      - "velite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-vize.yml"

permissions:
  contents: read

jobs:
  compare:
    name: compare · plugin-vue vs vize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # compare:ssg builds the app once per compiler (VIZE off → plugin-vue,
      # VIZE=true → vize), prints an HTML/JS/CSS/build-time table, and fails the
      # run if either compiler did not render real content. The shared gen:icons
      # + velite preflight runs once; only `vite-ssg build` is timed per compiler.
      - name: Compare prerendered output across compilers
        run: pnpm compare:ssg
