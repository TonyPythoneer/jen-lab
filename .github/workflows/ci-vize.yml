name: 🦀 CI · Vize Compiler

# The Vue SFC compiler sits behind the VIZE feature flag (vite.config.ts):
#   default       → @vitejs/plugin-vue (stable, production)
#   VIZE=true     → vize (Rust, experimental)
#
# This CI proves the SAME app renders correct prerendered HTML under BOTH
# compilers. vize is pre-1.0 and can exit 0 while every page collapses to an
# empty shell (its CJS-interop once duplicated vue-router and broke SSR
# provide/inject), so each build is followed by a content gate — `pnpm verify:ssg`
# fails the run if any route did not actually render.

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/ci/**"
      - "vite.config.ts"
      - "velite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - ".github/workflows/ci-vize.yml"
  push:
    branches: [chore/vize, develop, main]
    paths:
      - "src/**"
      - "scripts/ci/**"
      - "vite.config.ts"
      - "velite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-vize.yml"

permissions:
  contents: read

jobs:
  build:
    name: build · ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel the vize leg if the stable leg fails (or vice versa) — we
      # want to see both results on every run.
      fail-fast: false
      matrix:
        include:
          - label: plugin-vue (stable)
            vize: ""
          - label: vize (experimental)
            vize: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Full pipeline: gen:icons → velite build → vite-ssg build → vue-tsc.
      # VIZE selects the SFC compiler inside vite-ssg build.
      - name: Build (VIZE=${{ matrix.vize }})
        env:
          VIZE: ${{ matrix.vize }}
        run: pnpm build

      # Hard gate: a green build is not proof the pages rendered.
      - name: Verify prerendered output is real content
        run: pnpm verify:ssg
