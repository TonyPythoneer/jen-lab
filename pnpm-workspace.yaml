allowBuilds:
  "@parcel/watcher": true
  better-sqlite3: true
  esbuild: true
  sharp: true
  vue-demi: true
  workerd: true
catalog:
  rolldown: "^1.0.1"
  vite: npm:@voidzero-dev/vite-plus-core@^0.1.24
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
minimumReleaseAgeExclude:
  - "@vizejs/native-darwin-arm64@0.203.0"
  - "@vizejs/native-linux-arm64-gnu@0.203.0"
  - "@vizejs/native-linux-arm64-musl@0.203.0"
  - "@vizejs/native-linux-x64-gnu@0.203.0"
  - "@vizejs/native-linux-x64-musl@0.203.0"
  - "@vizejs/native-win32-x64-msvc@0.203.0"
  - "@vizejs/native@0.203.0"
  - "@vizejs/vite-plugin@0.203.0"
  - vize@0.203.0
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
