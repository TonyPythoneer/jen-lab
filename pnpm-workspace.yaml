allowBuilds:
  "@parcel/watcher": true
  better-sqlite3: true
  esbuild: true
  sharp: true
  vue-demi: true
  workerd: true
catalog:
  rolldown: "^1.1.1"
  vite: npm:@voidzero-dev/vite-plus-core@^0.1.24
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
minimumReleaseAgeExclude:
  - "@vizejs/*"
  - vize
  - "@typescript/native-preview"
  - "@typescript/native-preview-*"
  - rolldown
  - "@rolldown/*"
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
